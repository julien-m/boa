name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - name: Install search dependency
        run: command -v rg || brew install ripgrep
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Public source hygiene
        run: bun run check:public
      - name: Frontend quality
        run: bun run verify
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Browser UI contracts
        env:
          BOA_TEST_BROWSER: chromium
        run: |
          bunx playwright install chromium
          bun run dev > "$RUNNER_TEMP/boa-vite.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://localhost:1420 > /dev/null; then break; fi
            sleep 1
          done
          bun scripts/ui-smoke.ts
      - name: Build desktop app
        run: bun run mac:build -- --adhoc
      - name: Verify local bundle signature
        run: |
          codesign --force --deep --sign - src-tauri/target/release/bundle/macos/BOA.app
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/BOA.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent' src-tauri/target/release/bundle/macos/BOA.app/Contents/Info.plist)" = true
      - name: Archive build
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/BOA.app "$RUNNER_TEMP/BOA-${{ matrix.runner }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BOA-${{ matrix.runner }}
          path: ${{ runner.temp }}/BOA-${{ matrix.runner }}.zip
          retention-days: 7
