[package]
name = "boa"
version = "0.1.0"
description = "Cockpit local de projets et de revue Git"
authors = ["Julien M."]
license = "MIT"
repository = "https://github.com/julien-m/boa"
rust-version = "1.94"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-dialog = "2.8.3"
wait-timeout = "0.2.1"
tokio = { version = "1.53.3", features = ["sync"] }
tauri-plugin-drag = "2.1.1"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-clipboard-manager = "2.5.0"
notify = "8.2"
tempfile = "3.27.0"
toml_edit = "0.20.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSWindow", "NSApplication", "NSWorkspace", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSObject", "NSBundle"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
